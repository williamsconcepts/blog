<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Blog</title>

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <header>
      <div class="logo">My Blog</div>

      <div class="nav-icons">
        <i class="fa-regular fa-moon"></i>

        <i class="fa-regular fa-bell"></i>

        <button id="authBtn" class="auth-btn">Login</button>

        <div class="profile">
          <span id="userAvatar"> JD </span>

          <p id="username">
            John Doe

            <i class="fa-solid fa-chevron-down"></i>
          </p>
        </div>
      </div>
    </header>

    <main>
      <section class="content">
        <div class="create-post">
          <h2>Create a New Post</h2>

          <div class="inputs">
            <div>
              <label> Title </label>

              <input id="postTitle" placeholder="Enter an engaging title..." />
            </div>

            <div>
              <label> Category </label>

              <select id="categorySelect">
                <option>Select category</option>
              </select>
            </div>
          </div>

          <label> Content </label>

          <div class="editor">
            <textarea
              id="postContent"
              placeholder="Write your post content here..."
            ></textarea>
          </div>

          <div class="buttons">
            <button>Save Draft</button>

            <button id="publishBtn" class="publish">Publish Post</button>
          </div>
        </div>

        <div id="postsContainer"></div>
      </section>

      <aside>
        <div class="side-card">
          <h2>About</h2>
          <br>
          <p>
            Welcome to my blog! I write about life, travel and everything in
            between.
          </p>
        </div>

        <br>
        <div class="side-card">
          <h2>Categories</h2>
          <br>
          <ul id="categoryList"></ul>
        </div>

        <br>
        <div class="side-card">
          <h2>Popular Posts</h2>
          <br>
          <div id="popularPosts"></div>
        </div>
      </aside>
    </main>

    <!-- AUTH MODAL -->

    <div id="authModal" class="modal">
      <div class="modal-content">
        <span id="closeModal" class="close"> &times; </span>

        <h2 id="authTitle">Login</h2>

        <form id="loginForm">
          <input id="loginEmail" type="email" placeholder="Email" />

          <input id="loginPassword" type="password" placeholder="Password" />

          <button>Login</button>
        </form>

        <form id="registerForm" class="hidden">
          <input id="registerName" placeholder="Full name" />

          <input id="registerEmail" type="email" placeholder="Email" />

          <input id="registerPassword" type="password" placeholder="Password" />

          <button>Register</button>
        </form>

        <p class="switch">
          <span id="toggleAuth"> Create account </span>
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
